<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>N.E.C.O. - Network for Expressway Coordinate & Observation</title>
    <!-- PWA用設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #000;
            color: #fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
        }
        /* パスワード認証オーバーレイ */
        #auth-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 20px;
        }
        #auth-overlay input {
            padding: 12px;
            font-size: 18px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #222;
            color: #fff;
            width: 220px;
            text-align: center;
            margin-bottom: 15px;
        }
        #auth-overlay button {
            padding: 10px 24px;
            font-size: 16px;
            font-weight: bold;
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        #auth-error { color: #ff4444; font-size: 14px; margin-top: 10px; display: none; }

        /* ヘルパー・トップ */
        header {
            padding: 8px 10px;
            text-align: center;
            background: rgba(20,20,20,0.9);
            border-bottom: 1px solid #333;
        }
        .brand {
            font-size: 11px;
            color: #00ffff;
            letter-spacing: 2px;
            margin-bottom: 3px;
            font-weight: bold;
        }
        .control-row {
            display: flex;
            justify-content: center;
            gap: 6px;
            margin-top: 4px;
        }
        .select-btn {
            padding: 5px 8px;
            font-size: 12px;
            font-weight: bold;
            border: 1px solid #555;
            background: #222;
            color: #aaa;
            border-radius: 6px;
            cursor: pointer;
        }
        .select-btn.active {
            background: #00ffff;
            color: #000;
            border-color: #00ffff;
        }
        .dir-btn.active {
            background: #ffcc00;
            color: #000;
            border-color: #ffcc00;
        }

        /* 手動入力パネル（PC確認用） */
        #manual-panel {
            background: rgba(40,40,40,0.95);
            padding: 6px;
            margin-top: 6px;
            border-radius: 6px;
            display: none;
            justify-content: center;
            align-items: center;
            gap: 6px;
            font-size: 12px;
        }
        #manual-panel input {
            width: 90px;
            padding: 4px 6px;
            background: #111;
            border: 1px solid #666;
            color: #ffcc00;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            border-radius: 4px;
        }
        #manual-panel button {
            padding: 4px 10px;
            background: #ffcc00;
            border: none;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            color: #000;
        }

        /* メインディスプレイ */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 5px;
        }
        .route-name {
            font-size: 14px;
            color: #00ffff;
            margin-bottom: 2px;
            font-weight: bold;
        }
        /* 現在地エリア表示用バッジ */
        .current-zone-display {
            font-size: 15px;
            font-weight: bold;
            color: #00ff66;
            background: rgba(0, 255, 102, 0.1);
            border: 1px solid #00ff66;
            padding: 2px 12px;
            border-radius: 12px;
            margin-bottom: 4px;
            display: inline-block;
        }
        .kp-display {
            font-size: 60px;
            font-weight: 900;
            color: #ffcc00;
            text-shadow: 0 0 20px rgba(255,204,0,0.4);
            letter-spacing: 1px;
            margin: 2px 0;
        }
        .kp-unit {
            font-size: 26px;
            margin-left: 2px;
        }
        
        /* 次の施設までの距離を表示するボックス */
        .next-facility-box {
            background: rgba(30,30,30,0.85);
            border: 1px solid #444;
            border-radius: 8px;
            padding: 8px 16px;
            margin-top: 6px;
            width: 90%;
            max-width: 360px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .next-fac-label {
            font-size: 12px;
            color: #aaa;
            text-align: left;
        }
        .next-fac-name {
            font-size: 16px;
            font-weight: bold;
            color: #fff;
        }
        .next-fac-dist {
            font-size: 20px;
            font-weight: 900;
            color: #00ff66;
            text-align: right;
        }

        .auto-badge {
            font-size: 11px;
            background: #004444;
            color: #00ffff;
            padding: 2px 8px;
            border-radius: 4px;
            margin-top: 4px;
            display: inline-block;
        }

        /* フッター・ステータス */
        footer {
            background: rgba(15,15,15,0.9);
            padding: 8px 15px;
            font-size: 11px;
            color: #888;
            border-top: 1px solid #222;
            text-align: center;
            line-height: 1.4;
        }
        .status-ok { color: #00ff66; font-weight: bold; }
        .status-warn { color: #ffaa00; font-weight: bold; }
    </style>
</head>
<body>

    <!-- パスワード認証画面（パスワード: nexcokp） -->
    <div id="auth-overlay">
        <h2 style="margin-bottom: 15px; font-size: 20px;">N.E.C.O. System Auth</h2>
        <input type="password" id="pass-input" placeholder="パスワードを入力">
        <button onclick="checkPassword()">認証</button>
        <div id="auth-error">パスワードが違います</div>
    </div>

    <header>
        <div class="brand">N.E.C.O. EXPRESSWAY MONITOR</div>
        
        <!-- 路線・モード選択ボタン -->
        <div class="control-row">
            <button id="btn-tohoku" class="select-btn active" onclick="manualSelectRoute('TOHOKU')">東北道</button>
            <button id="btn-kenoh" class="select-btn" onclick="manualSelectRoute('KENOH')">圏央道</button>
            <button id="btn-mode-auto" class="select-btn active" onclick="setMode('AUTO')" style="background:#00aa00; color:#fff; border-color:#00cc00;">自動判定</button>
            <button id="btn-mode-manual" class="select-btn" onclick="setMode('MANUAL_PC')">手動(PC)</button>
        </div>

        <!-- 方向選択ボタン -->
        <div class="control-row" style="margin-top: 4px;">
            <button id="btn-up" class="select-btn dir-btn active" onclick="setDirection('UP')">UP (上り/内回り)</button>
            <button id="btn-down" class="select-btn dir-btn" onclick="setDirection('DOWN')">DOWN (下り/外回り)</button>
        </div>

        <!-- 手動入力用のコントロールパネル（PC確認用） -->
        <div id="manual-panel">
            <span>シミュレートKP:</span>
            <input type="number" id="manual-kp-input" value="33.3" step="0.1">
            <button onclick="applyManualKP()">適用</button>
        </div>
    </header>

    <main>
        <div class="route-name" id="route-text">東北自動車道 (上り)</div>
        <!-- 現在地エリア表示 -->
        <div id="current-zone" class="current-zone-display" style="display: none;">区間外</div>
        
        <div>
            <span class="kp-display" id="kp-val">--.-</span><span class="kp-unit">kp</span>
        </div>
        
        <!-- 次の施設までの距離を表示するボックス -->
        <div class="next-facility-box">
            <div>
                <div class="next-fac-label">次の施設 (NEXT)</div>
                <div class="next-fac-name" id="next-fac-name">読込中...</div>
            </div>
            <div>
                <div class="next-fac-label" style="text-align: right;">残り距離</div>
                <div class="next-fac-dist" id="next-fac-dist">-- km</div>
            </div>
        </div>

        <div id="auto-status-badge" class="auto-badge">自動判定モード稼働中</div>
    </main>

    <footer>
        <div id="gps-status">Status: 待機中</div>
        <div id="latlng-text">Lat/Lng: --,-- (Acc: --m)</div>
    </footer>

    <script>
        const APP_PASSWORD = "nexcokp";

        function checkPassword() {
            const inputVal = document.getElementById("pass-input").value;
            if (inputVal === APP_PASSWORD) {
                document.getElementById("auth-overlay").style.display = "none";
                initSystem();
            } else {
                document.getElementById("auth-error").style.display = "block";
            }
        }

        let currentRoute = 'TOHOKU';
        let currentDirection = 'UP';
        let operationMode = 'AUTO';
        let userOverrodeRoute = false;

        // --- KP区間データ ---
        const facilitiesData = {
            TOHOKU: [
                { name: "川口JCT", start: -0.59, end: 0.73, kp: 0.0, type: "JCT" },
                { name: "浦和IC", start: 2.89, end: 3.19, kp: 3.0, type: "IC" },
                { name: "浦和TB", start: 4.34, end: 5.34, kp: 4.8, type: "TB" },
                { name: "岩槻IC", start: 9.94, end: 11.01, kp: 10.5, type: "IC" },
                { name: "蓮田SA", start: 17.66, end: 18.60, kp: 17.6, type: "SA", dir: "UP" },
                { name: "蓮田SA", start: 17.63, end: 18.65, kp: 17.6, type: "SA", dir: "DOWN" },
                { name: "白岡BS", start: 20.19, end: 20.72, kp: 20.4, type: "BS" },
                { name: "久喜白岡JCT", start: 23.30, end: 24.40, kp: 22.2, type: "JCT" },
                { name: "久喜IC", start: 24.98, end: 25.84, kp: 24.3, type: "IC" },
                { name: "加須IC", start: 32.96, end: 33.68, kp: 33.3, type: "IC" },
                { name: "羽生IC", start: 39.09, end: 39.89, kp: 39.7, type: "IC" },
                { name: "羽生PA", start: 40.28, end: 41.00, kp: 40.6, type: "PA" },
                { name: "館林IC", start: 45.51, end: 46.28, kp: 45.4, type: "IC" },
                { name: "大島BS", start: 50.57, end: 51.06, kp: 50.8, type: "BS" },
                { name: "佐野藤岡IC", start: 54.37, end: 55.59, kp: 55.4, type: "IC" }
            ],
            KENOH: [
                { name: "川島IC", start: 41.0, end: 41.5, kp: 41.2, type: "IC" },
                { name: "桶川北本IC", start: 47.5, end: 48.1, kp: 47.8, type: "IC" },
                { name: "白岡菖蒲IC", start: 57.0, end: 58.0, kp: 57.5, type: "IC" },
                { name: "久喜白岡JCT", start: 59.8, end: 60.4, kp: 60.1, type: "JCT" },
                { name: "幸手IC", start: 64.5, end: 65.2, kp: 64.8, type: "IC" },
                { name: "五霞IC", start: 68.9, end: 69.5, kp: 69.2, type: "IC" },
                { name: "常総IC", start: 80.0, end: 81.0, kp: 80.5, type: "IC" }
            ]
        };

        function manualSelectRoute(route) {
            userOverrodeRoute = true;
            setRoute(route);
            if (operationMode === 'MANUAL_PC') applyManualKP();
        }

        function setRoute(route) {
            currentRoute = route;
            document.getElementById('btn-tohoku').classList.toggle('active', route === 'TOHOKU');
            document.getElementById('btn-kenoh').classList.toggle('active', route === 'KENOH');
            updateRouteText();
        }

        function setDirection(dir) {
            currentDirection = dir;
            document.getElementById('btn-up').classList.toggle('active', dir === 'UP');
            document.getElementById('btn-down').classList.toggle('active', dir === 'DOWN');
            updateRouteText();
            if (operationMode === 'MANUAL_PC') applyManualKP();
        }

        function setMode(mode) {
            operationMode = mode;
            const isAuto = (mode === 'AUTO');
            document.getElementById('btn-mode-auto').classList.toggle('active', isAuto);
            document.getElementById('btn-mode-auto').style.background = isAuto ? '#00aa00' : '#222';
            document.getElementById('btn-mode-manual').classList.toggle('active', !isAuto);
            document.getElementById('btn-mode-manual').style.background = !isAuto ? '#ffcc00' : '#222';
            document.getElementById('btn-mode-manual').style.color = !isAuto ? '#000' : '#aaa';
            
            document.getElementById('manual-panel').style.display = isAuto ? 'none' : 'flex';
            document.getElementById('auto-status-badge').style.display = isAuto ? 'inline-block' : 'none';

            if (!isAuto) {
                document.getElementById('gps-status').innerHTML = '<span class="status-warn">Manual PC Mode</span>';
                applyManualKP();
            } else {
                userOverrodeRoute = false;
            }
        }

        function updateRouteText() {
            const routeName = currentRoute === 'TOHOKU' ? '東北自動車道' : '首都圏中央連絡自動車道 (圏央道)';
            const dirName = currentDirection === 'UP' ? (currentRoute === 'TOHOKU' ? '上り' : '内回り') : (currentRoute === 'TOHOKU' ? '下り' : '外回り');
            document.getElementById('route-text').innerText = `${routeName} (${dirName})`;
        }

        function updateCurrentZone(currentKp) {
            const list = facilitiesData[currentRoute];
            const zoneEl = document.getElementById('current-zone');
            if (!list) {
                zoneEl.style.display = 'none';
                return;
            }

            let matchedZone = null;
            for (let f of list) {
                if (f.name === "蓮田SA" && f.dir && f.dir !== currentDirection) continue;
                if (currentKp >= f.start && currentKp <= f.end) {
                    matchedZone = f;
                    break;
                }
            }

            if (matchedZone) {
                zoneEl.innerText = `${matchedZone.name} (${matchedZone.type}) 区間内`;
                zoneEl.style.display = 'inline-block';
            } else {
                zoneEl.style.display = 'none';
            }
        }

        function updateNextFacility(currentKp) {
            const list = facilitiesData[currentRoute];
            if (!list) return;

            let uniqueList = [];
            let seenNames = new Set();
            for (let f of list) {
                if (f.name === "蓮田SA" && f.dir && f.dir !== currentDirection) continue;
                if (!seenNames.has(f.name)) {
                    seenNames.add(f.name);
                    uniqueList.push(f);
                }
            }

            let nextFac = null;
            let dist = 0;

            if (currentDirection === 'UP') {
                let candidates = uniqueList.filter(f => f.kp < currentKp);
                if (candidates.length > 0) {
                    candidates.sort((a, b) => b.kp - a.kp);
                    nextFac = candidates[0];
                    dist = currentKp - nextFac.kp;
                }
            } else {
                let candidates = uniqueList.filter(f => f.kp > currentKp);
                if (candidates.length > 0) {
                    candidates.sort((a, b) => a.kp - b.kp);
                    nextFac = candidates[0];
                    dist = nextFac.kp - currentKp;
                }
            }

            const nameEl = document.getElementById('next-fac-name');
            const distEl = document.getElementById('next-fac-dist');

            if (nextFac) {
                nameEl.innerText = `${nextFac.name} (${nextFac.type})`;
                distEl.innerText = `あと ${dist.toFixed(1)} km`;
            } else {
                nameEl.innerText = "前方施設なし";
                distEl.innerText = "-- km";
            }
        }

        function applyManualKP() {
            const valInput = document.getElementById('manual-kp-input').value;
            const val = parseFloat(valInput);
            if (!isNaN(val)) {
                // 小数点第一位まで確実に反映
                document.getElementById('kp-val').innerText = val.toFixed(1);
                document.getElementById('latlng-text').innerText = `Lat/Lng: Manual Input (Simulated)`;
                updateCurrentZone(val);
                updateNextFacility(val);
            }
        }

        function detectRouteAndCalculateKP(lat, lng) {
            if (!userOverrodeRoute) {
                if (lng >= 139.63 && lng <= 139.75 && lat >= 36.03 && lat <= 36.12) {
                    if (currentRoute !== 'KENOH') setRoute('KENOH');
                } else {
                    if (currentRoute !== 'TOHOKU') setRoute('TOHOKU');
                }
            }

            let estimatedKp = 0.0;
            if (currentRoute === 'TOHOKU') {
                const baseLat = 35.8050;
                estimatedKp = (lat - baseLat) * 111.13 + 2.93;
            } else {
                const kenohBaseLat = 36.0020;
                estimatedKp = (lat - kenohBaseLat) * 111.13 + 45.0;
            }

            if (estimatedKp < 0) estimatedKp = 0.0;
            return estimatedKp;
        }

        function initSystem() {
            if (!navigator.geolocation) {
                alert("お使いのブラウザは位置情報に対応していません。");
                return;
            }

            const statusEl = document.getElementById('gps-status');
            const latLngEl = document.getElementById('latlng-text');
            const kpValEl = document.getElementById('kp-val');

            const options = {
                enableHighAccuracy: true,
                maximumAge: 0,
                timeout: 5000
            };

            navigator.geolocation.watchPosition(
                (position) => {
                    if (operationMode !== 'AUTO') return;

                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const accuracy = position.coords.accuracy;
                    
                    const speedMs = position.coords.speed;
                    const speedKmH = (speedMs !== null && speedMs >= 0) ? speedMs * 3.6 : 0;

                    let modeText = "高速巡航";
                    if (speedKmH <= 50 && speedKmH > 5) {
                        modeText = "低速巡回 (高精度)";
                    } else if (speedKmH <= 5) {
                        modeText = "停止・徒歩 (超高精度)";
                    }

                    const kp = detectRouteAndCalculateKP(lat, lng);

                    // 小数点第一位まで確実に反映
                    kpValEl.innerText = kp.toFixed(1);
                    latLngEl.innerHTML = `Lat/Lng: ${lat.toFixed(4)}, ${lng.toFixed(4)} (Acc: ${Math.round(accuracy)}m)`;
                    statusEl.innerHTML = `<span class="status-ok">GPS Active (${modeText} / ${speedKmH.toFixed(0)}km/h)</span>`;

                    updateCurrentZone(kp);
                    updateNextFacility(kp);
                },
                (error) => {
                    if (operationMode === 'AUTO') {
                        statusEl.innerHTML = `<span class="status-warn">GPS Error (${error.code})</span>`;
                    }
                },
                options
            );
        }
    </script>
</body>
</html>
